name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The plugin is stdlib-only; the test battery runs under pytest.
      - name: Install the test runner
        run: python3 -m pip install pytest
      - name: Portability gate
        run: python3 -B check_portable.py
      - name: Test battery
        run: python3 -B run_tests.py
