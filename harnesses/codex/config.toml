# Pawl safety gates for OpenAI Codex.
# Add these PreToolUse hooks to ~/.codex/config.toml or .codex/config.toml

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 -B hooks/pawl_hook.py"
timeout = 15
statusMessage = "Pawl: checking send gates"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 -B hooks/pawl_git_hook.py"
timeout = 15
statusMessage = "Pawl: checking git safety"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 -B hooks/pawl_poll_hook.py"
timeout = 15
statusMessage = "Pawl: checking poll loops"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 -B hooks/pawl_readonly_hook.py"
timeout = 15
statusMessage = "Pawl: verifying readonly safety"

[[hooks.PreToolUse]]
matcher = ".*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 -B hooks/pawl_oscillation_hook.py"
timeout = 15
statusMessage = "Pawl: checking tool oscillation"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 -B hooks/pawl_fence_hook.py"
timeout = 15
statusMessage = "Pawl: enforcing boundary fences"
